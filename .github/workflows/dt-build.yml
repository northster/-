name: DT Keyboard APK

# Builds an installable APK on every push and publishes it as the "dev-latest" pre-release,
# so it can be downloaded directly on the phone.
on:
  push:
    branches: [ main, 'claude/**' ]
    paths-ignore: [ '**.md', 'scripts/**' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dt-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (fork)
        run: ./gradlew testDebugUnitTest --tests 'helium314.keyboard.fork.*' --stacktrace

      - name: Build APK
        env:
          DT_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DTKeyboard-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish release
        # one release per build with a rising version, newest is marked "latest":
        #  - direct link: https://github.com/<repo>/releases/latest/download/DTKeyboard-debug.apk
        #  - Obtainium can track the repo and update automatically
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dt-${{ github.run_number }}
          name: DT Keyboard 4.1-dt.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            ${{ github.event.head_commit.message }}

            Built from ${{ github.ref_name }} @ ${{ github.sha }}
          files: app/build/outputs/apk/debug/*.apk

      - name: Keep only the newest 10 builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E '^dt-[0-9]+$' | sort -t- -k2 -n -r | tail -n +11 \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag
          gh release delete dev-latest --yes --cleanup-tag || true

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}
