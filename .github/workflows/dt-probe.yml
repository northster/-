name: DT probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Vital articles
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          UA={"User-Agent":"DTKeyboard (https://github.com/northster/-)"}
          API="https://en.wikipedia.org/w/api.php"
          def get(params):
              url=API+"?"+urllib.parse.urlencode(params)
              return json.load(urllib.request.urlopen(urllib.request.Request(url,headers=UA)))
          for s in ["Wikipedia:Vital articles","Wikipedia:Vital articles/Level/4/Biology and health sciences/Animals","Wikipedia:Vital articles/Level/4/Everyday life","Wikipedia:Vital articles/Level/4/Geography/Cities"]:
              n=0; cont={}; sample=[]
              while True:
                  q=get(dict(action="query",format="json",formatversion=2,redirects=1,prop="links",titles=s,plnamespace=0,pllimit="max",**cont))
                  for p in q["query"]["pages"]:
                      ls=p.get("links",[]); n+=len(ls); sample+= [l["title"] for l in ls[:3]]
                  print("  redirects:", q["query"].get("redirects"))
                  if "continue" in q: cont=q["continue"]
                  else: break
              print(n, s, sample[:8])
          t=get(dict(action="parse",format="json",formatversion=2,redirects=1,prop="wikitext",page="Wikipedia:Vital articles/Level/4/Biology and health sciences/Animals"))["parse"]
          print(t["title"]); print(t["wikitext"][:1500])
          PY
