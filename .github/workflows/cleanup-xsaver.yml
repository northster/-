name: Remove XSaver releases

# one-off: XSaver moved to northster/XtoGif, so its pre-releases here would only confuse Obtainium
on:
  push:
    paths: [ '.github/workflows/cleanup-xsaver.yml' ]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E '^xsaver-' | xargs -r -I{} gh release delete {} --yes --cleanup-tag
