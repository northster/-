name: XSaver APK

# X 저장 (xsaver/): installable APK on every push that touches it, published as a pre-release "xsaver-1.0.N".
# The tag carries the app's versionName so Obtainium can tell which build is installed; titles start with "X 저장"
# so Obtainium entries for this repository can tell XSaver releases from DT Keyboard ones.
on:
  push:
    paths: [ 'xsaver/**', '.github/workflows/xsaver.yml' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xsaver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xsaver
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (links, API parsers, GIF size search)
        run: ./gradlew :core:test --stacktrace

      - name: Signing key
        # same personal key as DT Keyboard, so new builds install over old ones; without it the APK is debug signed
        env:
          DT_KEYSTORE_BASE64: ${{ secrets.DT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DT_KEYSTORE_BASE64" ]; then
            echo "$DT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/xs.jks"
            echo "XS_KEYSTORE_FILE=$RUNNER_TEMP/xs.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No DT_KEYSTORE_BASE64 secret: debug signed, updates will need an uninstall"
          fi

      - name: Build APK
        env:
          XS_BUILD_NUMBER: ${{ github.run_number }}
          XS_KEYSTORE_PASSWORD: ${{ secrets.DT_KEYSTORE_PASSWORD }}
          XS_KEY_ALIAS: ${{ secrets.DT_KEY_ALIAS }}
          XS_KEY_PASSWORD: ${{ secrets.DT_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XSaver
          path: xsaver/app/build/outputs/apk/release/*.apk

      - name: Publish pre-release
        # never "latest": that stays the keyboard's release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xsaver-1.0.${{ github.run_number }}
          name: X 저장 (XSaver) 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            X 저장 (XSaver) - X 게시물 미디어 저장 + GIF 변환. 휴대폰에서 아래 XSaver-release.apk를 받아 설치.

            ${{ github.event.head_commit.message }}

            Built from ${{ github.ref_name }} @ ${{ github.sha }}
          files: xsaver/app/build/outputs/apk/release/*.apk

      - name: Keep only the newest 3 XSaver builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E '^xsaver-1\.0\.[0-9]+$' | sort -V -r | tail -n +4 \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag
          # the first builds were tagged xsaver-N
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E '^xsaver-[0-9]+$' | xargs -r -I{} gh release delete {} --yes --cleanup-tag

      - name: Remove the signing key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/xs.jks"

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: xsaver-reports
          path: 'xsaver/*/build/reports'
        if: ${{ failure() }}
