name: DTboard release

# Proper releases: push a tag like v1.0.0 (git tag v1.0.0 && git push origin v1.0.0, or create the release on GitHub
# with a new v… tag). Builds the release APK ("DTboard", app id without .debug, same key as the dev builds) and
# publishes it as the latest release:
#   https://github.com/<repo>/releases/latest/download/DTboard-release.apk
# Run by hand (Actions > DTboard release > Run workflow) with a version (e.g. 0.1.0-beta.1) it makes the tag v<version>
# on the commit it ran on and publishes the release the same way; without one it only builds and keeps the APK as a
# workflow artifact.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.1.0-beta.1); empty = test build only'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: dt-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (fork)
        run: ./gradlew testDebugUnitTest --tests 'helium314.keyboard.fork.*' --stacktrace

      - name: Version
        # v1.2.0 -> 1.2.0; a run by hand is a release with its version given, else a test build
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "DT_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "DT_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          elif [ -n "$INPUT_VERSION" ]; then
            v="${INPUT_VERSION#v}"
            if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "::error::Not a version: $INPUT_VERSION"; exit 1
            fi
            echo "DT_VERSION_NAME=$v" >> "$GITHUB_ENV"
            echo "DT_TAG=v$v" >> "$GITHUB_ENV"
          else
            echo "DT_VERSION_NAME=test-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Signing key
        env:
          DT_KEYSTORE_BASE64: ${{ secrets.DT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DT_KEYSTORE_BASE64" ]; then
            echo "::error::Signing key missing: add the DT_KEYSTORE_BASE64, DT_KEYSTORE_PASSWORD and DT_KEY_ALIAS repository secrets"
            exit 1
          fi
          echo "$DT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dt-release.jks"
          echo "DT_KEYSTORE_FILE=$RUNNER_TEMP/dt-release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          # rises with every release run; the release app has its own id, so it is independent of the dev numbers
          DT_BUILD_NUMBER: ${{ github.run_number }}
          DT_KEYSTORE_PASSWORD: ${{ secrets.DT_KEYSTORE_PASSWORD }}
          DT_KEY_ALIAS: ${{ secrets.DT_KEY_ALIAS }}
          DT_KEY_PASSWORD: ${{ secrets.DT_KEY_PASSWORD }}
          DT_KLIPY_KEY: ${{ secrets.DT_KLIPY_KEY }}
          DT_GIPHY_KEY: ${{ secrets.DT_GIPHY_KEY }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DTboard-release
          path: app/build/outputs/apk/release/*.apk

      - name: Publish release
        if: ${{ env.DT_TAG != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.DT_TAG }}
          target_commitish: ${{ github.sha }}
          name: DTboard ${{ env.DT_VERSION_NAME }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk

      - name: Remove the signing key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/dt-release.jks"

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}
