name: DT probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Wikipedia DYK archive
        run: |
          UA="DTKeyboard (https://github.com/northster/-)"
          curl -s -A "$UA" "https://en.wikipedia.org/w/api.php?action=parse&format=json&formatversion=2&prop=wikitext&page=Wikipedia:Recent%20additions/2019/March" -o page.json -w "HTTP %{http_code}\n"
          head -c 300 page.json; echo
          python3 - <<'PY'
          import json
          d=json.load(open('page.json'))
          t=d.get('parse',{}).get('wikitext','')
          lines=[l for l in t.splitlines() if l.strip().startswith('*')]
          print('star lines', len(lines))
          for l in lines[:8]: print(repr(l[:200]))
          PY
          curl -s -A "$UA" "https://en.wikipedia.org/w/api.php?action=query&format=json&formatversion=2&list=search&srnamespace=4&srlimit=3&srsearch=%22cat%22%20prefix:Wikipedia:Recent%20additions/" | head -c 600; echo
