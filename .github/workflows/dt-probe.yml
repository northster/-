name: DT probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Wikipedia DYK archive
        run: |
          UA="DTKeyboard (https://github.com/northster/-)"
          for P in "Wikipedia:Did%20you%20know%20archive/2019/March" "Wikipedia:Did%20you%20know%20archive/2013/July"; do
          curl -s -A "$UA" "https://en.wikipedia.org/w/api.php?action=parse&format=json&formatversion=2&redirects=1&prop=wikitext&page=$P" -o page.json -w "HTTP %{http_code}\n"
          head -c 200 page.json; echo
          python3 - <<'PY'
          import json
          d=json.load(open('page.json'))
          t=d.get('parse',{}).get('wikitext','')
          print('chars', len(t))
          lines=[l for l in t.splitlines() if l.strip().startswith('*')]
          print('star lines', len(lines))
          for l in lines[:6]: print(repr(l[:220]))
          other=[l for l in t.splitlines() if 'that' in l][:4]
          for l in other: print('THAT', repr(l[:220]))
          PY
          done
          curl -s -A "$UA" "https://en.wikipedia.org/w/api.php?action=query&format=json&formatversion=2&list=search&srnamespace=4&srlimit=3&srsearch=%22cat%22%20prefix:Wikipedia:Did%20you%20know%20archive/" | head -c 700; echo
