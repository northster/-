name: DT probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Vital articles
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          UA={"User-Agent":"DTKeyboard (https://github.com/northster/-)"}
          API="https://en.wikipedia.org/w/api.php"
          def get(params):
              url=API+"?"+urllib.parse.urlencode(params)
              return json.load(urllib.request.urlopen(urllib.request.Request(url,headers=UA)))
          d=get(dict(action="query",format="json",formatversion=2,list="allpages",apnamespace=4,apprefix="Vital articles/Level/4",aplimit=100))
          subs=[p["title"] for p in d["query"]["allpages"]]
          print(len(subs)); print(subs)
          total=0
          for s in subs[:40]:
              n=0; cont={}
              while True:
                  q=get(dict(action="query",format="json",formatversion=2,prop="links",titles=s,plnamespace=0,pllimit="max",**cont))
                  for p in q["query"]["pages"]: n+=len(p.get("links",[]))
                  if "continue" in q: cont=q["continue"]
                  else: break
              total+=n; print(n, s)
          print("total", total)
          q=get(dict(action="query",format="json",formatversion=2,prop="extracts",exintro=1,explaintext=1,exlimit=20,titles="Sea otter|Chocolate|Moon"))
          for p in q["query"]["pages"]: print(p["title"], len(p.get("extract","")), repr(p.get("extract","")[:300]))
          PY
