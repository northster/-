name: DT Keyboard APK

# Dev builds: an installable APK on every push ("DT Keyboard Dev", its own app id with .debug), published as a
# pre-release dt-N so it can be downloaded directly on the phone. Proper releases come from dt-release.yml (tag v*).
on:
  push:
    branches: [ main, 'claude/**' ]
    paths-ignore: [ '**.md', 'scripts/**', 'pebble/**' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dt-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (fork)
        run: ./gradlew testDebugUnitTest --tests 'helium314.keyboard.fork.*' --stacktrace

      - name: Signing key
        # the key lives only in the repository secrets; a published APK must never be signed with anything else
        env:
          DT_KEYSTORE_BASE64: ${{ secrets.DT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DT_KEYSTORE_BASE64" ]; then
            echo "::error::Signing key missing: add the DT_KEYSTORE_BASE64, DT_KEYSTORE_PASSWORD and DT_KEY_ALIAS repository secrets"
            exit 1
          fi
          echo "$DT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dt-release.jks"
          echo "DT_KEYSTORE_FILE=$RUNNER_TEMP/dt-release.jks" >> "$GITHUB_ENV"

      - name: Built-in GIF keys
        # only says whether they are there, never the keys
        env:
          DT_KLIPY_KEY: ${{ secrets.DT_KLIPY_KEY }}
          DT_GIPHY_KEY: ${{ secrets.DT_GIPHY_KEY }}
        run: |
          echo "KLIPY: $([ -n "$DT_KLIPY_KEY" ] && echo set || echo none)"
          echo "GIPHY: $([ -n "$DT_GIPHY_KEY" ] && echo set || echo none)"

      - name: Build APK
        env:
          DT_BUILD_NUMBER: ${{ github.run_number }}
          DT_KEYSTORE_PASSWORD: ${{ secrets.DT_KEYSTORE_PASSWORD }}
          DT_KEY_ALIAS: ${{ secrets.DT_KEY_ALIAS }}
          DT_KEY_PASSWORD: ${{ secrets.DT_KEY_PASSWORD }}
          DT_KLIPY_KEY: ${{ secrets.DT_KLIPY_KEY }}
          DT_GIPHY_KEY: ${{ secrets.DT_GIPHY_KEY }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DTKeyboard-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish release
        # one pre-release per build with a rising version; "latest" is kept for the proper releases (dt-release.yml).
        # Obtainium: track the repo with "include prereleases" and an APK filter "debug" for the dev builds
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dt-${{ github.run_number }}
          name: DT Keyboard Dev 4.1-dt.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            ${{ github.event.head_commit.message }}

            Built from ${{ github.ref_name }} @ ${{ github.sha }}
          files: app/build/outputs/apk/debug/*.apk

      - name: Keep only the newest 10 builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E '^dt-[0-9]+$' | sort -t- -k2 -n -r | tail -n +11 \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag
          gh release delete dev-latest --yes --cleanup-tag || true

      - name: Remove the signing key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/dt-release.jks"

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}
