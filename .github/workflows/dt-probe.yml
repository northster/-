name: DT probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: How many DYK hooks are about well-read articles
        run: |
          python3 - <<'PY'
          import json, re, random, urllib.request, urllib.parse
          UA={"User-Agent":"DTKeyboard (https://github.com/northster/-)"}
          API="https://en.wikipedia.org/w/api.php"
          def get(params):
              url=API+"?"+urllib.parse.urlencode(params)
              return json.load(urllib.request.urlopen(urllib.request.Request(url,headers=UA)))
          for page in ["Wikipedia:Did you know archive/2016/May","Wikipedia:Did you know archive/2021/October"]:
              t=get(dict(action="parse",format="json",formatversion=2,redirects=1,prop="wikitext",page=page))["parse"]["wikitext"]
              hooks=[]
              for l in t.splitlines():
                  s=l.strip()
                  if not s.startswith("*"): continue
                  s=s.lstrip("* ").removeprefix("...").removeprefix("…").strip()
                  if not s.startswith("that "): continue
                  m=re.search(r"'''+\s*\[\[([^|\]#]+)", l) or re.search(r"\[\[([^|\]#:]+)", l)
                  if m: hooks.append((m.group(1).strip(), s))
              random.shuffle(hooks); sample=hooks[:150]
              views={}
              titles=list(dict.fromkeys(h[0] for h in sample))
              for i in range(0,len(titles),50):
                  q=get(dict(action="query",format="json",formatversion=2,redirects=1,prop="pageviews",pvipdays=30,titles="|".join(titles[i:i+50])))["query"]
                  ren={}
                  for k in ("normalized","redirects"):
                      for x in q.get(k,[]): ren[x["to"]]=x["from"]
                  for p in q["pages"]:
                      s=sum(v for v in (p.get("pageviews") or {}).values() if v)
                      tt=p["title"]; n=0
                      while tt not in titles and n<3: tt=ren.get(tt,tt); n+=1
                      views[tt]=s
              vals=sorted((views.get(h[0],0),h[1][:90]) for h in sample)[::-1]
              print(page, "hooks", len(hooks), "sampled", len(sample))
              for th in (1000,3000,10000): print("  >=",th, sum(1 for v,_ in vals if v>=th))
              for v,s in vals[:8]: print("   ",v,s)
          PY
